<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Step Goal Tracker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        text-align: center;
        padding-top: 60px;
      }
      .box {
        width: 380px;
        background: white;
        padding: 25px;
        border-radius: 8px;
        margin: auto;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);
      }
      input {
        width: 90%;
        padding: 10px;
        margin-bottom: 12px;
        font-size: 16px;
      }
      button {
        background: #0077cc;
        padding: 10px 20px;
        border: none;
        color: white;
        font-size: 17px;
        cursor: pointer;
        border-radius: 5px;
      }
      #result {
        margin-top: 15px;
        font-size: 22px;
        font-weight: bold;
        color: #333;
      }

      /* Progress Circle */
      .circle {
        position: relative;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: conic-gradient(#28a745 0deg, #ddd 0deg);
        margin: 20px auto;
      }
      .circle-inner {
        position: absolute;
        width: 110px;
        height: 110px;
        background: white;
        border-radius: 50%;
        top: 20px;
        left: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Step Goal Tracker</h2>

      <input type="number" id="steps" placeholder="Enter steps taken" />
      <button onclick="trackSteps()">Check Progress</button>

      <div id="result"></div>

      <div class="circle" id="circle">
        <div class="circle-inner" id="circleValue">0%</div>
      </div>
    </div>

    <script>
      function trackSteps() {
        let steps = parseInt(document.getElementById("steps").value);

        if (isNaN(steps) || steps < 0) {
          document.getElementById("result").innerHTML =
            "⚠ Enter valid step count!";
          return;
        }

        // Ternary operator (comparison)
        let message = steps >= 10000 ? "Goal Achieved 🎉" : "Keep Going 💪";

        document.getElementById("result").innerHTML = message;

        // Progress circle calculation (max = 10,000)
        let percent = Math.min((steps / 10000) * 100, 100);
        let degrees = percent * 3.6;

        document.getElementById(
          "circle"
        ).style.background = `conic-gradient(#28a745 ${degrees}deg, #ddd ${degrees}deg)`;

        document.getElementById("circleValue").innerHTML =
          Math.round(percent) + "%";
      }
    </script>
  </body>
</html>
