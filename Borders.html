<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>1 - Borders & Padding Demo</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header><h1>Borders & Padding</h1></header>
  <main>
    <section class="row">
      <div class="box solid">solid<br><span class="pad">padding: 10px</span></div>
      <div class="box dashed">dashed<br><span class="pad">padding: 20px</span></div>
      <div class="box double">double<br><span class="pad">padding: 30px</span></div>
      <div class="box groove">groove<br><span class="pad">border-radius: 12px</span></div>
    </section>
  </main>
  <footer>Simple demo — hover to change border color.</footer>
</body>
</html>
