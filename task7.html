<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Alert Example</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="p-4">
    <div class="container text-center">
      <h3 class="mb-4 text-primary">Reusable Bootstrap Components</h3>
      <!-- Reusable Buttons -->
      <button class="btn btn-primary m-2">Submit</button>
      <button class="btn btn-success m-2">Save</button>
      <button class="btn btn-danger m-2">Delete</button>
      <!-- Reusable Card -->
      
    </div>

    <div class="container">
      <h2 class="mb-4">Bootstrap Alerts</h2>
      <div class="alert alert-primary" role="alert">
        This is a primary alert -- check it out!
      </div>
      <div class="alert alert-success" role="alert">
        Success! Your action was completed successfully.
      </div>
      <div class="alert alert-warning" role="alert">
        Warning! Please double-check your input.
      </div>
      <div class="alert alert-danger" role="alert">
        Error! Something went wrong.
      </div>
    </div>

    <div class="card mt-4 mx-auto" style="width: 18rem">
        <img
          src="https://picsum.photos/300/200"
          class="card-img-top"
          alt="Random"
        />
        <div class="card-body">
          <h5 class="card-title">Reusable Card</h5>
          <p class="card-text">
            This card uses Bootstrap's predefined structure and classes.
          </p>
          <a href="#" class="btn btn-primary">Read More</a>
        </div>
      </div>
  </body>
</html>
