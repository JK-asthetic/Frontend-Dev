<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>6 - Transforms</title>
    <link rel="stylesheet" href="Transforms.css" />
  </head>
  <body>
    <header><h1>Transforms</h1></header>
    <main class="row">
      <figure class="tile rotate">
        <div class="box">Rotate</div>
        <figcaption>rotate()</figcaption>
      </figure>
      <figure class="tile scale">
        <div class="box">Scale</div>
        <figcaption>scale()</figcaption>
      </figure>
      <figure class="tile translate">
        <div class="box">Translate</div>
        <figcaption>translate()</figcaption>
      </figure>
      <figure class="tile skew">
        <div class="box">Skew</div>
        <figcaption>skew()</figcaption>
      </figure>
    </main>
  </body>
</html>
